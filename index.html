<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="림버스 컴퍼니의 수감자 인격을 이름, 소속, 키워드와 코스트로 찾는 비영리 팬 사이트입니다. 이 사이트에서 사용하는 모든 데이터의 저작권은 Project Moon에 있습니다.">
  <meta name="theme-color" content="#151919">
  <title>인격 키워드 · 림버스 컴퍼니</title>
  <link rel="stylesheet" href="styles.css">
  <script src="catalog.js" defer></script>
  <script src="search.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="intro">
      <details class="site-menu" id="site-menu">
        <summary aria-label="사이트 메뉴"><span class="hamburger-icon" aria-hidden="true"></span></summary>
        <div class="site-menu-panel">
          <h2>사이트 정보</h2>
          <p class="site-version">버전 1.0</p>
          <p>림버스 컴퍼니의 수감자 인격을 검색하는 비영리 팬 사이트입니다.</p>
          <p>이 사이트에서 사용하는 모든 데이터의 저작권은 Project Moon에 있습니다.</p>
        </div>
      </details>
      <p class="game-name">림버스 컴퍼니</p>
      <h1>인격 키워드</h1>
      <p>키워드와 코스트를 함께 선택하면 두 조건을 모두 만족하는 인격을 표시합니다.</p>
    </header>

    <main>
      <section class="filters" aria-label="인격 필터">
        <div class="filter-heading">
          <h2 id="filter-title">키워드</h2>
          <button class="reset" id="reset" type="button" disabled>초기화</button>
        </div>
        <div class="filter-buttons" id="keyword-buttons" role="group" aria-labelledby="filter-title"></div>
        <div class="cost-filters">
          <h2 id="cost-title">코스트</h2>
          <div class="filter-buttons" id="cost-buttons" role="group" aria-labelledby="cost-title"></div>
        </div>
        <noscript><p>인격을 검색하려면 JavaScript를 켜 주세요.</p></noscript>
      </section>

      <div class="identity-search" role="search" aria-labelledby="search-label">
        <label id="search-label" for="identity-search">인격 검색</label>
        <div class="search-controls">
          <input id="identity-search" type="search" placeholder="수감자, 인격 이름, 소속" autocomplete="off" spellcheck="false">
          <button class="reset" id="clear-search" type="button" aria-label="검색어 지우기" disabled>지우기</button>
        </div>
      </div>

      <section class="results" aria-labelledby="results-title">
        <header class="results-heading">
          <div class="results-title">
            <h2 id="results-title">수감자별 인격</h2>
            <span id="result-count" role="status"></span>
          </div>
          <p>인격을 눌러 소속을 확인하세요.</p>
        </header>
        <div id="results"></div>
      </section>
    </main>

    <footer>
      <time datetime="2026-11-26">2026.11.26 기준</time>
    </footer>
  </div>

  <dialog id="details" aria-labelledby="detail-name">
    <div class="dialog-content">
      <div class="dialog-heading">
        <p id="detail-sinner"></p>
        <form method="dialog"><button class="close" type="submit" autofocus>닫기</button></form>
      </div>
      <div class="identity-heading">
        <h2 id="detail-name"></h2>
        <span class="cost" id="detail-cost" hidden></span>
      </div>
      <h3 id="affiliation-title">소속</h3>
      <ul class="affiliations" id="affiliations" aria-labelledby="affiliation-title"></ul>
      <p id="no-affiliations" hidden>원본에 등록된 소속이 없습니다.</p>
    </div>
  </dialog>
</body>
</html>
